[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pare-static-mcp"
version = "0.1.0"
description = "Static-analysis MCP worker for PARE (Android APK)"
requires-python = ">=3.12"
dependencies = [
    "androguard==4.1.3",
    "mcp>=1.27.0,<2",   # 2.0 renamed streamablehttp_client; agent_core targets 1.x
    "pare-worker-kit @ git+https://github.com/EdibleTuber/pare-worker-kit.git@v0.2.0",   # the wire-contract constants + run_worker; mcp-only, so a Pi stays small
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
pare-static-mcp = "pare_static_mcp.server:main"

[tool.hatch.metadata]
# Required for the pare-worker-kit git dependency above. Without it,
# hatchling refuses ANY direct URL reference and the package cannot be
# installed at all -- not "installs with a warning", but a hard
# metadata-generation failure on a clean checkout.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pare_static_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
